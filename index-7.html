/* Polished micro-interactions */
@keyframes successCheckIn{0%{opacity:0;transform:scale(.62) rotate(-10deg)}55%{opacity:1;transform:scale(1.08) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
@keyframes summaryRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes feedbackPop{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes softFlash{0%{box-shadow:0 0 0 0 rgba(109,90,248,.22)}100%{box-shadow:0 0 0 9px rgba(109,90,248,0)}}
@keyframes valueSwap{0%{opacity:.45;transform:translateY(4px)}100%{opacity:1;transform:none}}
@keyframes itemSettle{0%{transform:scale(1)}45%{transform:scale(.965)}100%{transform:scale(1)}}
.result-page.page-enter .success-icon{animation:successCheckIn .5s cubic-bezier(.22,1,.36,1) both}
.result-page.page-enter .summary-item{opacity:0;animation:summaryRise .36s cubic-bezier(.22,1,.36,1) both}
.result-page.page-enter .summary-item:nth-child(1){animation-delay:.06s}.result-page.page-enter .summary-item:nth-child(2){animation-delay:.10s}.result-page.page-enter .summary-item:nth-child(3){animation-delay:.14s}.result-page.page-enter .summary-item:nth-child(4){animation-delay:.18s}.result-page.page-enter .summary-item:nth-child(5){animation-delay:.22s}
.btn.feedback-pop{animation:feedbackPop .32s cubic-bezier(.22,1,.36,1),softFlash .55s ease}
.result-msg.feedback-show{animation:valueSwap .24s ease}
.variation-pulse{animation:valueSwap .26s cubic-bezier(.22,1,.36,1)}
.picker-item.item-settle{animation:itemSettle .18s ease}

async function copyAndOpen(service){
  const promptText=$('prompt').value;if(!promptText)return;
  const config=service==='gemini'?{name:'Gemini',url:'https://gemini.google.com/app',button:$('openGemini')}:{name:'ChatGPT',url:'https://chatgpt.com/',button:$('openChatGPT')};
  const newTab=window.open('about:blank','_blank');
  if(newTab){try{newTab.opener=null}catch(e){}}
  let copied=false;
  try{
    if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(promptText);copied=true}else{throw 0}
  }catch(e){
    try{const ta=document.createElement('textarea');ta.value=promptText;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();copied=document.execCommand('copy');ta.remove()}catch(e2){copied=false}
  }
  if(newTab){
    try{newTab.location.replace(config.url)}catch(e){newTab.location.href=config.url}
    showResultMessage((copied?T().openCopied:T().copyBlockedOpen)+' '+config.name+'…');
  }else{
    showResultMessage(copied?T().openBlocked:T().copyBlockedOpen+' '+config.name+'.');
  }
  pulseFeedback(config.button);
  setTimeout(()=>$('savedmsg').textContent='',2200);
}

// Adaptive sticky headers: compact after scrolling while keeping actions visible.
(function(){
  const top=document.querySelector('.top');
  const resultTop=document.querySelector('.result-topbar');
  let ticking=false;
  function syncStickyHeader(){
    const compact=window.scrollY>28;
    if(top) top.classList.toggle('is-compact',compact);
    if(resultTop) resultTop.classList.toggle('is-compact',compact);
    ticking=false;
  }
  window.addEventListener('scroll',()=>{
    if(!ticking){ticking=true;requestAnimationFrame(syncStickyHeader)}
  },{passive:true});
  syncStickyHeader();
})();


let deferredInstallPrompt=null;
function isStandaloneApp(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function isIOSDevice(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}
function renderInstallSteps(){
  const t=T(),steps=isIOSDevice()?t.installIOS:t.installAndroid,wrap=$('installSteps');
  if(!wrap)return;
  wrap.innerHTML=steps.map((s,i)=>`<li><span class="install-step-num">${i+1}</span><span>${s}</span></li>`).join('');
}
function refreshInstallButton(){
  const btn=$('installApp');if(!btn)return;
  const installed=isStandaloneApp();
  btn.classList.toggle('is-installed',installed);
  $('installAppLabel').textContent=installed?T().installInstalled:T().installApp;
  btn.disabled=installed;
  btn.setAttribute('aria-label',installed?T().installInstalled:T().installApp);
}
function openInstallSheet(){const s=$('installSheet');renderInstallSteps();s.classList.add('show');s.setAttribute('aria-hidden','false')}
function closeInstallSheet(){const s=$('installSheet');s.classList.remove('show');s.setAttribute('aria-hidden','true')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;refreshInstallButton()});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;refreshInstallButton();closeInstallSheet()});
$('installApp').addEventListener('click',async()=>{
  if(isStandaloneApp())return;
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    try{await deferredInstallPrompt.userChoice}catch(e){}
    deferredInstallPrompt=null;refreshInstallButton();
  }else{openInstallSheet()}
});
$('installClose').addEventListener('click',closeInstallSheet);

}
